<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Money Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="login-screen" class="screen">
  <div class="login-box">
    <h1>💰 Money Tracker</h1>
    <input type="password" id="passcode-input" placeholder="Mã truy cập" inputmode="numeric">
    <button id="login-btn">Vào</button>
    <p id="login-error" class="hidden"></p>
  </div>
</div>

<div id="app-screen" class="hidden">
  <header>
    <h1>💰 Money Tracker</h1>
    <div class="month-nav">
      <button id="prev-month">‹</button>
      <span id="month-label"></span>
      <button id="next-month">›</button>
    </div>
  </header>

  <main>
    <section class="stats-row">
      <div class="stat-card expense">
        <span class="label">💸 Chi tiêu</span>
        <span class="value" id="total-expense">0đ</span>
        <span class="sub" id="compare-expense"></span>
      </div>
      <div class="stat-card income">
        <span class="label">💰 Thu nhập</span>
        <span class="value" id="total-income">0đ</span>
        <span class="sub" id="compare-income"></span>
      </div>
    </section>

    <section id="budget-bar" class="hidden">
      <div class="budget-row">
        <span id="budget-label"></span>
      </div>
      <div class="budget-track"><div class="budget-fill" id="budget-fill"></div></div>
    </section>

    <section class="chart-card">
      <canvas id="trend-chart"></canvas>
    </section>

    <section class="chart-card">
      <canvas id="pie-chart"></canvas>
    </section>

    <section class="chart-card">
      <canvas id="bar-chart"></canvas>
    </section>

    <section id="top-spends" class="hidden">
      <h2>Top khoản chi</h2>
      <div id="top-items"></div>
    </section>

    <section id="tx-section">
      <div class="tx-header">
        <h2>Lịch sử thu chi</h2>
        <div class="view-toggle">
          <button id="view-list" class="vt-btn active">Danh sách</button>
          <button id="view-cal" class="vt-btn">Lịch</button>
        </div>
      </div>

      <div id="calendar-view" class="hidden">
        <div class="cal-weekdays">
          <span>Hai</span><span>Ba</span><span>Tư</span><span>Năm</span><span>Sáu</span><span>Bảy</span><span>CN</span>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
      </div>

      <div id="list-view">
        <div class="tx-header" style="margin-top:0.6rem">
          <button id="add-btn" class="primary-btn">＋ Thêm</button>
        </div>
        <div class="filter-row">
          <input type="text" id="search-input" placeholder="🔍 Tìm ghi chú...">
          <select id="category-filter"><option value="">Tất cả nhóm</option></select>
        </div>
        <div id="tx-items"></div>
      </div>
    </section>
  </main>

  <button id="theme-toggle" title="Sáng/tối">☀️</button>

  <div id="add-modal" class="modal hidden">
    <div class="modal-box">
      <h2>Thêm giao dịch</h2>
      <div class="seg-toggle">
        <button class="seg active" data-type="expense">💸 Chi</button>
        <button class="seg" data-type="income">💰 Thu</button>
      </div>
      <input type="number" id="modal-amount" placeholder="Số tiền (đ)" inputmode="numeric">
      <input type="text" id="modal-note" placeholder="Ghi chú (vd: ăn trưa)">
      <select id="modal-category"></select>
      <input type="date" id="modal-date">
      <div class="modal-actions">
        <button id="modal-cancel">Hủy</button>
        <button id="modal-save" class="primary-btn">Lưu</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
